version: 1

rules:
  - id: no-hardcoded-spanish
    pattern: >
      ["']([^"']*[ÁÉÍÓÚÑáéíóúñü¡¿][^"']*)["']
    message: >
      ⚠️ Se encontró texto en español duro. Usa la función de traducción __() o @lang() en lugar de texto directo.
    severity: warning
    condition:
      notMatch: (__\(|@lang\()
